<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Contact Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="min-h-screen p-4">
      <div
        class="relative mx-auto w-full rounded-xl bg-red-50 p-4 md:max-w-md lg:max-w-md"
      >
        <div class="mb-3 flex items-center justify-between">
          <h1 class="text-3xl font-semibold text-amber-950 capitalize">
            Edit Contact
          </h1>
          <a
            class="rounded-full bg-amber-950 px-4 py-3 text-sm font-medium text-white hover:bg-amber-900"
            href="#"
            ><i class="fa-solid fa-floppy-disk"></i> Save</a
          >
        </div>
        <div class="p-4">
          <div class="rounded-xl bg-red-100 p-6">
            <h5 class="mb-4 text-sm font-semibold text-amber-950">
              Picture and calling card
            </h5>
            <div class="flex items-center justify-center">
              <div
                class="size-32 rounded-full bg-red-200 text-center text-7xl text-amber-950"
              >
                <img
                  class="rounded-full object-contain"
                  src="./images/1.jpg"
                  alt="User-1"
                />
              </div>
            </div>
          </div>
        </div>
        <div class="rounded-lg p-4">
          <form action="">
            <div class="mb-3">
              <input
                class="w-full rounded-md border border-amber-900 bg-red-50 px-4 py-3 text-sm text-amber-950 outline-0 placeholder:text-amber-950"
                type="text"
                placeholder="First name"
              />
            </div>
            <div class="mb-6">
              <input
                class="w-full rounded-md border border-amber-900 bg-red-50 px-4 py-3 text-sm text-amber-950 outline-0 placeholder:text-amber-950"
                type="text"
                placeholder="Last name"
              />
            </div>
            <div class="mb-3">
              <input
                class="w-full rounded-md border border-amber-900 bg-red-50 px-4 py-3 text-sm text-amber-950 outline-0 placeholder:text-amber-950"
                type="text"
                placeholder="Email"
              />
            </div>
            <div class="mb-3">
              <input
                class="w-full rounded-md border border-amber-900 bg-red-50 px-4 py-3 text-sm text-amber-950 outline-0 placeholder:text-amber-950"
                type="text"
                placeholder="Location"
              />
            </div>
            <div class="mb-6">
              <input
                class="w-full rounded-md border border-amber-900 bg-red-50 px-4 py-3 text-sm text-amber-950 outline-0 placeholder:text-amber-950"
                type="text"
                placeholder="Company"
              />
            </div>
            <div>
              <input
                class="w-full rounded-md border border-amber-900 bg-red-50 px-4 py-3 text-sm text-amber-950 outline-0 placeholder:text-amber-950"
                type="text"
                placeholder="Mobile"
              />
            </div>
          </form>
        </div>
        <div class="flex flex-col items-center justify-center">
          <p class="text-xs font-medium text-amber-900">Saving to google</p>
          <span class="block text-xs font-semibold text-amber-950"
            >(contactadmin@domain.com)</span
          >
        </div>
      </div>
    </main>
  </body>
</html>
