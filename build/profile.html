<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Details Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="min-h-dvh p-4">
      <div class="mx-auto w-full rounded-xl bg-red-50 p-3 lg:max-w-md">
        <div class="mb-3 flex items-center justify-between">
          <h1 class="text-3xl font-medium text-amber-950">Profile</h1>
          <a
            class="rounded-full bg-amber-950 px-4 py-2 text-sm font-medium text-white hover:bg-amber-900"
            href="#"
            ><i class="fa-regular fa-pen-to-square"></i> Edit</a
          >
        </div>
        <div class="mb-3 flex flex-col items-center justify-center">
          <div class="relative size-24 rounded-full bg-red-200">
            <img
              class="rounded-full object-cover"
              src="./images/1.jpg"
              alt="User"
            />
            <div
              class="absolute top-2/3 -right-0.5 size-7 rounded-full bg-amber-950 py-0.75 text-center text-white"
            >
              <i class="fa-regular fa-heart"></i>
            </div>
          </div>
          <h2 class="text-2xl font-medium text-amber-950">Olivia Rhye</h2>
          <p class="text-xs font-medium text-amber-900">
            olivia.rhye@domain.com
          </p>
        </div>
        <div class="mb-3">
          <ul class="flex flex-col">
            <li
              class="flex items-center gap-x-2 rounded-tl-lg rounded-tr-lg border-b border-red-50 bg-white p-3"
            >
              <div class="size-6 rounded-full text-center text-amber-950">
                <i class="fa-solid fa-phone"></i>
              </div>
              <div>
                <h5 class="text-sm font-medium text-amber-950">770-736-8031</h5>
                <span class="block text-[10px] font-semibold text-amber-900"
                  >Mobile</span
                >
              </div>
            </li>
            <li
              class="flex items-center gap-x-2 border-b border-red-50 bg-white p-3"
            >
              <div class="size-6 rounded-full text-center text-amber-950">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <div>
                <h5 class="text-sm font-medium text-amber-950">
                  olivia.rhye@domain.com
                </h5>
                <span class="block text-[10px] font-semibold text-amber-900"
                  >Email</span
                >
              </div>
            </li>
            <li
              class="flex items-center gap-x-2 border-b border-red-50 bg-white p-3"
            >
              <div class="size-6 rounded-full text-center text-amber-950">
                <i class="fa-solid fa-location-pin"></i>
              </div>
              <div>
                <h5 class="text-sm font-medium text-amber-950">
                  Victor Plains
                </h5>
                <span class="block text-[10px] font-semibold text-amber-900"
                  >Address</span
                >
              </div>
            </li>
            <li
              class="flex items-center gap-x-2 rounded-br-lg rounded-bl-lg bg-white p-3"
            >
              <div class="size-6 rounded-full text-center text-amber-950">
                <i class="fa-solid fa-cake-candles"></i>
              </div>
              <div>
                <h5 class="text-sm font-medium text-amber-950">Friends</h5>
                <span class="block text-[10px] font-semibold text-amber-900"
                  >Birth Day</span
                >
              </div>
            </li>
          </ul>
        </div>
        <div class="mb-3">
          <ul class="flex flex-col">
            <li
              class="flex items-center gap-x-2 rounded-tl-lg rounded-tr-lg border-b border-red-50 bg-white p-3"
            >
              <button
                class="flex cursor-pointer items-center gap-x-2 text-amber-950 hover:text-red-400"
              >
                <div
                  class="size-6 rounded-full text-center text-amber-950 hover:text-red-400"
                >
                  <i class="fa-solid fa-ban"></i>
                </div>
                <span class="block text-sm font-medium">Block Number</span>
              </button>
            </li>
            <li
              class="flex items-center gap-x-2 rounded-br-lg rounded-bl-lg bg-white p-3"
            >
              <button
                class="flex cursor-pointer items-center gap-x-2 text-amber-950 hover:text-red-400"
              >
                <div
                  class="size-6 rounded-full text-center text-amber-950 hover:text-red-400"
                >
                  <i class="fa-solid fa-trash-can"></i>
                </div>
                <span class="block text-sm font-medium">Delete</span>
              </button>
            </li>
          </ul>
        </div>
        <div class="text-center">
          <p class="text-xs text-amber-950">Added 16 Jan 2025</p>
          <span class="block text-[10px] font-medium text-amber-900"
            >(olivia.rhye@domain.com)</span
          >
        </div>
      </div>
    </main>
  </body>
</html>
