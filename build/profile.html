<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="min-h-screen p-4">
      <div
        class="relative mx-auto w-full rounded-xl bg-red-50 p-4 md:max-w-md lg:max-w-md"
      >
        <div class="mb-3 flex items-center justify-between">
          <h1 class="text-3xl font-semibold text-amber-950 capitalize">
            Profile
          </h1>
          <a
            class="rounded-full bg-amber-950 px-4 py-3 text-sm font-medium text-white hover:bg-amber-900"
            href="#"
            ><i class="fa-regular fa-pen-to-square"></i> Edit</a
          >
        </div>
        <div class="mb-3 flex flex-col items-center justify-center gap-1.5">
          <div class="relative size-32 rounded-full bg-red-100">
            <img
              class="rounded-full object-contain"
              src="./images/1.jpg"
              alt="User-1"
            />
            <div
              class="absolute right-1.5 bottom-0 size-9 rounded-full border border-red-100 bg-red-100 py-1 text-center text-lg text-amber-950"
            >
              <i class="fa-regular fa-heart"></i>
            </div>
          </div>
          <h2 class="text-2xl font-medium text-amber-950 capitalize">
            Olivia Rhye
          </h2>
        </div>
        <div class="mb-3">
          <ul class="flex flex-col">
            <li
              class="flex w-full items-center justify-between rounded-tl-lg rounded-tr-lg border-b border-red-50 bg-white p-3"
            >
              <div class="flex items-center gap-2">
                <div class="size-6 rounded-full text-center text-amber-950">
                  <i class="fa-solid fa-phone"></i>
                </div>
                <div>
                  <h5 class="text-sm font-semibold text-amber-950">
                    770-736-8031
                  </h5>
                  <span class="block text-xs font-medium text-amber-900"
                    >Mobile</span
                  >
                </div>
              </div>
            </li>
            <li
              class="flex w-full items-center justify-between border-b border-red-50 bg-white p-3"
            >
              <div class="flex items-center gap-2">
                <div class="size-6 rounded-full text-center text-amber-950">
                  <i class="fa-solid fa-envelope"></i>
                </div>
                <div>
                  <h5 class="text-sm font-semibold text-amber-950">
                    Olivia.Rhye@domain.com
                  </h5>
                  <span class="block text-xs font-medium text-amber-900"
                    >Email</span
                  >
                </div>
              </div>
            </li>
            <li
              class="flex w-full items-center justify-between border-b border-red-50 bg-white p-3"
            >
              <div class="flex items-center gap-2">
                <div class="size-6 rounded-full text-center text-amber-950">
                  <i class="fa-solid fa-location-pin"></i>
                </div>
                <div>
                  <h5 class="text-sm font-semibold text-amber-950">
                    Kattie Turnpike
                  </h5>
                  <span class="block text-xs font-medium text-amber-900"
                    >Location</span
                  >
                </div>
              </div>
            </li>
            <li
              class="flex w-full items-center justify-between rounded-br-lg rounded-bl-lg bg-white p-3"
            >
              <div class="flex items-center gap-2">
                <div class="size-6 rounded-full text-center text-amber-950">
                  <i class="fa-solid fa-building"></i>
                </div>
                <div>
                  <h5 class="text-sm font-semibold text-amber-950">
                    Yost and Sons
                  </h5>
                  <span class="block text-xs font-medium text-amber-900"
                    >Company</span
                  >
                </div>
              </div>
            </li>
          </ul>
        </div>
        <div class="mb-3 rounded-lg">
          <div
            class="rounded-tl-lg rounded-tr-lg bg-red-100 p-3 font-semibold text-amber-950"
          >
            <h3>Connected Apps</h3>
          </div>
          <div
            class="flex items-center gap-2 rounded-br-lg rounded-bl-lg bg-white p-3"
          >
            <div class="size-6 rounded-full text-center text-amber-950">
              <i class="fa-brands fa-whatsapp"></i>
            </div>
            <h5 class="text-sm font-semibold text-amber-950">Whatsapp</h5>
          </div>
        </div>
        <div class="mb-3">
          <ul class="flex flex-col">
            <li
              class="flex w-full items-center justify-between rounded-tl-lg rounded-tr-lg border-b border-red-50 bg-white p-3"
            >
              <button
                class="inline-flex cursor-pointer items-center gap-2.5 text-sm font-semibold text-amber-950 capitalize hover:text-red-400"
              >
                <i class="fa-solid fa-ban text-base"></i> Block Number
              </button>
            </li>
            <li
              class="flex w-full items-center justify-between rounded-br-lg rounded-bl-lg bg-white p-3"
            >
              <button
                class="inline-flex cursor-pointer items-center gap-2.5 text-sm font-semibold text-amber-950 capitalize hover:text-red-400"
              >
                <i class="fa-solid fa-trash text-base"></i> Delete
              </button>
            </li>
          </ul>
        </div>
        <div class="flex flex-col items-center justify-center">
          <p class="text-xs font-medium text-amber-900">Added 15 Mar 2025</p>
          <span class="block text-xs font-semibold text-amber-950"
            >(contactadmin@domain.com)</span
          >
        </div>
      </div>
    </main>
  </body>
</html>
